<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a22"><link rel="icon" href="data:,">
<title>Laveria — A world of your own</title>
<style>
:root{--ink:#17232a;--cream:#f4e8c8;--gold:#e7ad55;--mint:#8fd1a1;--panel:#172a2c;--line:#49615a}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101a22;color:var(--cream);font-family:Georgia,'Times New Roman',serif}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:var(--cream);border:1px solid #718574;background:#263a36;padding:12px 20px;box-shadow:0 4px 0 #0b1518;transition:.15s}button:hover{background:#385449;transform:translateY(-2px);filter:brightness(1.13)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1518}#app{height:100%;position:relative;overflow:hidden;background:linear-gradient(#142734,#263d47 55%,#5f775f)}#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,17,20,.78),rgba(8,17,20,.08) 80%),linear-gradient(0deg,rgba(8,17,20,.48),transparent 40%);pointer-events:none}.brand{position:absolute;top:7%;left:9%;font-size:clamp(54px,9vw,112px);font-weight:bold;letter-spacing:.04em;color:#f5dc9b;text-shadow:4px 5px 0 #68472e,7px 8px 0 rgba(10,20,20,.55);line-height:.9}.tagline{position:absolute;top:calc(7% + clamp(61px,10vw,122px));left:10%;letter-spacing:.18em;text-transform:uppercase;font:12px Arial,sans-serif;color:#d2d7b4}.menuButtons{position:absolute;left:10%;top:48%;display:grid;gap:12px;width:min(290px,80vw)}.menuButtons button{font-size:18px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:16px 21px}.menuButtons button:first-child{background:#a8763c;border-color:#e4bc73;color:#fff4d8}.version{position:absolute;bottom:18px;left:20px;font:11px Arial,sans-serif;color:#d7d2b2aa;letter-spacing:.13em}.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,18,21,.78);backdrop-filter:blur(5px);padding:16px}.card{width:min(580px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#243936,#18282d);border:1px solid #87906d;box-shadow:0 18px 70px #0009,inset 0 0 0 5px #101e21;padding:clamp(20px,4vw,36px);position:relative}.card:before{content:'';position:absolute;inset:8px;border:1px solid #627260;pointer-events:none;opacity:.5}.card h2{margin:0 0 7px;color:#f2d594;font-size:30px}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9eb996}.sub{color:#c6cfb2;margin:0 0 22px}.field{display:grid;gap:8px;margin:17px 0}.field label{font:12px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a8c1a2}.field input{background:#101f22;border:1px solid #597068;color:white;padding:13px;outline:none}.field input:focus{border-color:#e4bc73}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}.row button.primary{background:#a8763c;border-color:#dfb46d}.error{color:#ffb19a;min-height:18px;font:13px Arial,sans-serif}.worldList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:45vh;overflow:auto;padding:2px}.worldChoice{padding:12px;text-align:left;min-height:74px}.worldChoice b{display:block;color:#f3d89e}.worldChoice span{display:block;font:11px Arial,sans-serif;color:#afc0a9;margin-top:5px}.worldChoice.selected{border-color:#f1ce81;background:#4b5539}.hud{position:absolute;inset:0;pointer-events:none;font-family:Arial,sans-serif}.topbar{position:absolute;top:18px;left:20px;right:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.worldTitle{font:bold 12px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:1px 2px #17231d;color:#f1e7c9}.health{color:#f18a70;font-size:22px;letter-spacing:3px;text-shadow:1px 2px #17231d;margin-top:8px}.hudbtn{pointer-events:auto;font:11px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px}.hotbar{position:absolute;bottom:21px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto;padding:7px;background:#101c20bc;border:1px solid #9a9568;box-shadow:0 4px 16px #0008}.slot{width:57px;height:58px;background:#25342fbf;border:1px solid #74806a;position:relative;display:grid;place-items:center;cursor:pointer}.slot.active{outline:2px solid #f3cb73;transform:translateY(-5px)}.icon{font-size:28px;filter:drop-shadow(2px 2px #121919)}.count{position:absolute;bottom:2px;right:4px;font-size:11px;color:#fff;text-shadow:1px 1px #000}.slotnum{position:absolute;left:4px;top:3px;font-size:9px;color:#c3c4a4}.hint{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);font:12px Arial,sans-serif;color:#fff1c5;text-shadow:1px 2px #13211d;background:#13221cb0;padding:7px 11px;white-space:nowrap}.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);font:12px Arial,sans-serif;background:#172b27dd;padding:10px 15px;border:1px solid #a68e58;pointer-events:none;opacity:0;transition:.2s}.toast.show{opacity:1}.touchControls{display:none;pointer-events:none;position:absolute;bottom:22px;left:14px;right:14px;justify-content:space-between}.touchGroup{display:flex;gap:8px}.touchControls button{pointer-events:auto;width:54px;height:54px;padding:0;border-radius:50%;background:#172a2ccc;font:bold 20px Arial,sans-serif;touch-action:none}.paused{position:absolute;inset:0;display:grid;place-items:center;background:#09131599;backdrop-filter:blur(3px)}.paused .card{width:min(340px,90vw);text-align:center}.paused .row{justify-content:center;flex-wrap:wrap}.small{font:12px Arial,sans-serif;color:#b9c9b0;line-height:1.55}.hide{display:none!important}@media(max-width:700px){.brand{left:7%;top:11%}.tagline{left:8%;top:calc(11% + clamp(61px,10vw,122px))}.menuButtons{left:8%;top:45%;width:min(270px,84vw)}.slot{width:44px;height:48px}.hotbar{gap:3px;padding:5px}.icon{font-size:23px}.hint{bottom:88px;font-size:10px}.touchControls{display:flex}.hudbtn{padding:8px;font-size:10px}.worldList{grid-template-columns:1fr}}
</style>

<body><main id="app"><canvas id="game"></canvas><div id="menuScene"><div class="shade"></div><div class="brand">LAVERIA</div><div class="tagline">A little world, waiting to be found</div><div class="menuButtons"><button id="singleBtn">Single Player <span style="float:right">›</span></button></div><div class="version">AN ADVENTURE IN THE MAKING&nbsp; · &nbsp;v0.1</div></div><div id="modalRoot"></div><div id="hud" class="hud hide"><div class="topbar"><div><div class="worldTitle" id="worldTitle"></div><div class="health" id="health"></div></div><button id="pauseBtn" class="hudbtn">Ⅱ &nbsp; Pause</button></div><div class="hint" id="hint">A quiet world. Take a look around.</div><div class="hotbar" id="hotbar"></div><div class="toast" id="toast"></div><div class="touchControls"><div class="touchGroup"><button data-touch="left">◀</button><button data-touch="right">▶</button></div><div class="touchGroup"><button data-touch="jump">↟</button><button data-touch="action">⚒</button></div></div></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s), canvas=$('#game'),ctx=canvas.getContext('2d');
const SEEDS=[['Sunmeadow',18427],['Mossbell Hollow',73109],['Copperfall',240613],['Moonpetal Vale',515017],['Amberwild',880321],['Cloudberry Coast',104729],['Wispwood',230003],['Thistlefen',451877],['Candlepine',640007],['Starling Reach',777013],['Dewdrop Downs',915131],['Foxglove Forest',1200317],['Pebblewick',1440011],['Lunaris Glen',1681901],['Brackenmere',1907341],['Honeycrag',2147483],['Bluebell Basin',2756047],['Oakenwake',3194419],['Saffron Shore',4010357],['Everspring',5189021]];
const TILE=24,W=180,H=75,items={woodSword:{name:'Wooden Shortsword',icon:'🗡️',type:'weapon'},woodPick:{name:'Wooden Pickaxe',icon:'⛏️',type:'pick'},woodAxe:{name:'Wooden Axe',icon:'🪓',type:'axe'},dirt:{name:'Dirt Block',icon:'🟫',type:'block'},stone:{name:'Stone Block',icon:'⬜',type:'block'},wood:{name:'Wood',icon:'🪵',type:'block'},apple:{name:'Wild Berry',icon:'🍎',type:'food'}};
let save=loadSave(),scene='menu',world=null,player=null,camera={x:0,y:0},keys={},mouse={x:0,y:0,down:false,button:0},last=0,acc=0,activeSlot=0,toastTimer=0,selectedSeed=0;
function loadSave(){try{return JSON.parse(localStorage.getItem('laveria-save'))||{character:null,worlds:{}}}catch{return{character:null,worlds:{}}}}
function persist(){try{localStorage.setItem('laveria-save',JSON.stringify(save))}catch{notify('Storage is full. Some progress may not save.')}}
function makeCharacter(name){save.character={name,inventory:[{id:'woodSword',count:1},{id:'woodPick',count:1},{id:'woodAxe',count:1},{id:'dirt',count:0},{id:'stone',count:0},{id:'wood',count:0},{id:'apple',count:0}],health:100};persist()}
function showModal(html){$('#modalRoot').innerHTML=`<div class="panel"><div class="card">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function characterFlow(){if(!save.character){showModal(`<div class="eyebrow">A new adventurer</div><h2>Make your character</h2><p class="sub">Every great journey begins with a name.</p><form id="charForm"><div class="field"><label for="charName">Character name</label><input id="charName" maxlength="18" placeholder="e.g. Rowan" autocomplete="off" required></div><div class="error" id="formError"></div><div class="row"><button type="button" id="backBtn">Back</button><button class="primary" type="submit">Create character →</button></div></form>`);$('#backBtn').onclick=()=>{closeModal();scene='menu'};$('#charForm').onsubmit=e=>{e.preventDefault();const n=$('#charName').value.trim();if(!n){$('#formError').textContent='Please choose a name.';return}makeCharacter(n);openWorldPicker()};$('#charName').focus()}else openWorldPicker()}
function openWorldPicker(){const saved=Object.values(save.worlds);let list=SEEDS.map(([name,seed],i)=>{let existing=save.worlds[seed];return `<button class="worldChoice ${selectedSeed===i?'selected':''}" data-index="${i}"><b>${existing?'✦ ':''}${name}</b><span>SEED ${seed} · ${existing?'Continue exploring':'Untouched world'}</span></button>`}).join('');showModal(`<div class="eyebrow">${save.character.name} · ${saved.length} world${saved.length===1?'':'s'} explored</div><h2>Choose a world</h2><p class="sub">Twenty little worlds, each with its own seed.</p><div class="worldList">${list}</div><div class="error" id="worldError"></div><div class="row"><button id="worldBack">Back</button><button class="primary" id="enterWorld">${saved.length?'Enter world':'Create world'} →</button></div>`);document.querySelectorAll('.worldChoice').forEach(b=>b.onclick=()=>{selectedSeed=+b.dataset.index;document.querySelectorAll('.worldChoice').forEach(x=>x.classList.toggle('selected',x===b));$('#enterWorld').textContent=(save.worlds[SEEDS[selectedSeed][1]]?'Enter world':'Create world')+' →'});$('#worldBack').onclick=()=>{if(!save.character){closeModal();scene='menu'}else{closeModal();scene='menu'}};$('#enterWorld').onclick=()=>startWorld(SEEDS[selectedSeed])}
function startWorld([name,seed]){let key=String(seed);if(!save.worlds[key])save.worlds[key]={name,seed,edits:{},time:0};world=save.worlds[key];if(!world.map)generateWorld(world);player={x:12*TILE,y:world.surface[12]*TILE-34,vx:0,vy:0,w:15,h:31,onGround:false,face:1,health:save.character.health||100,attack:0};camera.x=Math.max(0,player.x-innerWidth*.42);scene='game';closeModal();$('#menuScene').classList.add('hide');$('#hud').classList.remove('hide');$('#worldTitle').textContent=`${save.character.name}  ·  ${world.name}`;drawHotbar();notify(`Welcome to ${world.name}`);persist();resize()}
function random(seed){let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function generateWorld(w){const r=random(w.seed);w.map=Array.from({length:H},()=>Array(W).fill(0));w.surface=[];let h=34;for(let x=0;x<W;x++){h+=Math.floor(r()*3)-1;h=Math.max(25,Math.min(43,h));w.surface[x]=h;for(let y=h;y<H;y++)w.map[y][x]=y===h?1:y<h+5?2:(r()<.08?4:3)}for(let x=6;x<W-5;x++){if(r()<.105){let ground=w.surface[x];let tall=4+Math.floor(r()*4);for(let y=ground-1;y>ground-tall;y--)w.map[y][x]=5;for(let cy=ground-tall-2;cy<ground-tall+2;cy++)for(let cx=x-2;cx<=x+2;cx++)if(cy>=0&&cx>=0&&cx<W&&!(Math.abs(cx-x)===2&&Math.abs(cy-(ground-tall))===2)&&r()>.13)w.map[cy][cx]=6}}for(let x=0;x<W;x++)for(let y=0;y<H;y++){let k=`${x},${y}`;if(w.edits[k]!==undefined)w.map[y][x]=w.edits[k]}}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',resize);resize();
function drawHotbar(){const bar=$('#hotbar');bar.innerHTML='';save.character.inventory.forEach((it,i)=>{const slot=document.createElement('div');slot.className='slot'+(i===activeSlot?' active':'');slot.innerHTML=`<span class="slotnum">${i+1}</span>${it.count?`<span class="icon">${items[it.id].icon}</span><span class="count">${it.count}</span>`:''}`;slot.title=items[it.id].name;slot.onclick=()=>{activeSlot=i;drawHotbar()};bar.append(slot)})}
function notify(text){const el=$('#toast');el.textContent=text;el.classList.add('show');toastTimer=2.2}
$('#singleBtn').onclick=characterFlow;$('#pauseBtn').onclick=togglePause;
function togglePause(){if(scene==='game'){scene='paused';showPause()}else if(scene==='paused'){scene='game';closeModal()}}
function showPause(){showModal(`<div class="eyebrow">Taking a breath</div><h2>Paused</h2><p class="small">Your character's bag travels with you between every world. Progress is saved automatically.</p><div class="row"><button id="resume">Keep exploring</button><button id="toWorlds">World select</button><button id="toTitle">Title screen</button></div>`);$('#resume').onclick=()=>{scene='game';closeModal()};$('#toWorlds').onclick=()=>{persist();scene='picker';$('#hud').classList.add('hide');openWorldPicker()};$('#toTitle').onclick=()=>{persist();scene='menu';closeModal();$('#hud').classList.add('hide');$('#menuScene').classList.remove('hide')}}
function tile(x,y){if(x<0||x>=W||y<0)return 0;if(y>=H)return 3;return world.map[y][x]}
function blockColor(id,x,y){const n=((x*29+y*17)%7);return id===1?['#6f9b59','#7ba863','#709b5b'][n%3]:id===2?['#795439','#866044','#765339'][n%3]:id===3?['#626b69','#737875','#5a6464'][n%3]:id===4?'#b4a08b':id===5?'#775133':id===6?['#478250','#57905a','#4c8750'][n%3]:'#000'}
function draw(){const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#1c3442');sky.addColorStop(.55,'#78917e');sky.addColorStop(1,'#c7ae78');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);let time=(world?.time||0);let sunX=w*.74+Math.sin(time*.015)*w*.16;ctx.fillStyle='#f8d987';ctx.beginPath();ctx.arc(sunX,h*.19,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f8dc9a44';ctx.beginPath();ctx.arc(sunX,h*.19,42,0,Math.PI*2);ctx.fill();drawHills(w,h);if(world){let start=Math.max(0,Math.floor(camera.x/TILE)-2),end=Math.min(W,Math.ceil((camera.x+w)/TILE)+2);for(let x=start;x<end;x++)for(let y=0;y<H;y++){let id=tile(x,y);if(!id)continue;let px=x*TILE-camera.x,py=y*TILE-camera.y;if(py>h+4||py<-TILE)continue;ctx.fillStyle=blockColor(id,x,y);ctx.fillRect(Math.floor(px),Math.floor(py),TILE+1,TILE+1);if(id===1){ctx.fillStyle='#9ac477';ctx.fillRect(px,py,TILE,4);ctx.fillStyle='#527b48';ctx.fillRect(px,py+4,TILE,2)}if(id===6){ctx.fillStyle='#72a65f';ctx.fillRect(px+4,py+5,4,4);ctx.fillRect(px+15,py+12,4,4)}if(id===3&&(x*7+y*13)%5===0){ctx.fillStyle='#88908a';ctx.fillRect(px+5,py+8,4,3)}if(id!==6&&id!==1){ctx.strokeStyle='#151f1d22';ctx.strokeRect(px+.5,py+.5,TILE-1,TILE-1)}}drawPlayer()}}
function drawHills(w,h){for(let layer=0;layer<3;layer++){let base=h*(.52+layer*.11),amp=26+layer*14;ctx.fillStyle=['#a2ad83','#738d6b','#506d59'][layer];ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+8;x+=8){let y=base+Math.sin((x+camera.x*(.10+layer*.09))*.006+layer*2)*amp+Math.sin((x+camera.x*.12)*.015)*10;ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.closePath();ctx.fill()}}
function drawPlayer(){let x=Math.round(player.x-camera.x),y=Math.round(player.y-camera.y);ctx.save();if(player.face<0){ctx.translate(x+player.w,0);ctx.scale(-1,1);x=0}else x=0; // draw relative to mirrored origin
ctx.fillStyle='#372c29';ctx.fillRect(x+3,y+22,5,9);ctx.fillRect(x+9,y+22,5,9);ctx.fillStyle='#4e8290';ctx.fillRect(x+2,y+12,13,12);ctx.fillStyle='#d5a77d';ctx.fillRect(x+3,y+2,12,11);ctx.fillStyle='#5e4637';ctx.fillRect(x+2,y,13,5);ctx.fillStyle='#e7d59e';ctx.fillRect(x+12,y+6,2,2);if(player.attack>0){ctx.strokeStyle='#f6d990';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+14,y+16,20,-.8,.7);ctx.stroke()}ctx.restore()}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(scene==='game'){update(dt);draw()}else if(scene==='menu'){drawMenuBackdrop(dt)}else if(scene==='paused'){draw()}requestAnimationFrame(loop)}
function drawMenuBackdrop(dt){camera.x+=dt*8;draw()}
requestAnimationFrame(loop);
let slimes=[],actionCooldown=0,autoSave=0;
function solid(id){return id===1||id===2||id===3||id===4||id===5}
function collides(x,y){const l=Math.floor(x/TILE),r=Math.floor((x+player.w-1)/TILE),top=Math.floor(y/TILE),bot=Math.floor((y+player.h-1)/TILE);for(let tx=l;tx<=r;tx++)for(let ty=top;ty<=bot;ty++)if(solid(tile(tx,ty)))return true;return false}
function update(dt){world.time=(world.time||0)+dt*5;actionCooldown=Math.max(0,actionCooldown-dt);player.attack=Math.max(0,player.attack-dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('show')}
let dir=(keys.ArrowRight||keys.KeyD||keys.right?1:0)-(keys.ArrowLeft||keys.KeyA||keys.left?1:0);if(dir){player.vx+=dir*1100*dt;player.face=dir}else player.vx*=Math.pow(.001,dt);player.vx=Math.max(-190,Math.min(190,player.vx));player.x+=player.vx*dt;if(collides(player.x,player.y)){player.x-=player.vx*dt;player.vx=0}
if((keys.Space||keys.ArrowUp||keys.KeyW||keys.jump)&&player.onGround){player.vy=-410;player.onGround=false}player.vy=Math.min(750,player.vy+1000*dt);player.y+=player.vy*dt;player.onGround=false;if(collides(player.x,player.y)){player.y-=player.vy*dt;if(player.vy>0)player.onGround=true;player.vy=0}
player.x=Math.max(0,Math.min(W*TILE-player.w,player.x));camera.x=Math.max(0,Math.min(W*TILE-innerWidth,player.x-innerWidth*.43));camera.y=Math.max(0,Math.min(H*TILE-innerHeight,player.y-innerHeight*.52));
if(mouse.down&&mouse.button===0&&actionCooldown<=0)useTool(mouse.x,mouse.y);if(mouse.down&&mouse.button===2&&actionCooldown<=0)placeBlock(mouse.x,mouse.y);if(keys.KeyE){keys.KeyE=false;useFood()}
updateSlimes(dt);autoSave+=dt;if(autoSave>4){autoSave=0;save.character.health=player.health;persist()}}
function selectedItem(){return save.character.inventory[activeSlot]}
function addItem(id,n=1){let inv=save.character.inventory;let stack=inv.find(i=>i.id===id&&i.count>0);if(!stack)stack=inv.find(i=>!i.count);if(!stack){notify('Your pockets are full');return}stack.id=id;stack.count+=n;drawHotbar()}
function useTool(sx,sy){const inv=selectedItem();if(!inv?.count)return;const tx=Math.floor((sx+camera.x)/TILE),ty=Math.floor((sy+camera.y)/TILE),id=tile(tx,ty);if(inv.id==='woodSword'){player.attack=.25;actionCooldown=.3;player.health=Math.min(100,player.health);let hit=slimes.find(s=>!s.dead&&Math.abs((s.x+10)-(player.x+player.w/2))<55&&Math.abs(s.y-player.y)<50);if(hit){hit.hp--;if(hit.hp<=0){hit.dead=true;addItem('apple',1);notify('A wild berry!')}}return}if(!id||id===6||id===5&&inv.id!=='woodAxe'||id!==5&&inv.id!=='woodPick')return;if(Math.abs(tx*TILE-player.x)>100||Math.abs(ty*TILE-player.y)>100)return;world.map[ty][tx]=0;world.edits[`${tx},${ty}`]=0;if(id===5)addItem('wood',2);else if(id===1||id===2)addItem('dirt');else if(id===3||id===4)addItem('stone');actionCooldown=.22;drawHotbar()}
function placeBlock(sx,sy){const inv=selectedItem();if(!inv?.count||items[inv.id]?.type!=='block')return;const tx=Math.floor((sx+camera.x)/TILE),ty=Math.floor((sy+camera.y)/TILE);if(tx<0||tx>=W||ty<0||ty>=H||tile(tx,ty)!==0)return;const px=player.x+player.w/2,py=player.y+player.h/2;if(Math.hypot(tx*TILE+12-px,ty*TILE+12-py)>130)return;let id=inv.id==='dirt'?2:inv.id==='stone'?3:inv.id==='wood'?5:0;if(!id)return;world.map[ty][tx]=id;world.edits[`${tx},${ty}`]=id;inv.count--;drawHotbar();actionCooldown=.16}
function useFood(){let food=save.character.inventory.find(i=>i.id==='apple'&&i.count>0);if(!food){notify('No berries yet');return}food.count--;player.health=Math.min(100,player.health+25);drawHotbar();notify('A little more energy')}
function updateSlimes(dt){if(slimes.length===0&&Math.random()<dt*.12)slimes.push({x:player.x+220,y:player.y+10,v:0,hp:2,dead:false});slimes=slimes.filter(s=>!s.dead&&Math.abs(s.x-player.x)<700);for(const s of slimes){let dx=player.x-s.x;if(Math.abs(dx)<230)s.v+=(Math.sign(dx)*50-s.v)*dt;s.x+=s.v*dt;let gx=Math.floor((s.x+10)/TILE);s.y=(world.surface[Math.max(0,Math.min(W-1,gx))]||35)*TILE-18;if(Math.abs(s.x-player.x)<20&&Math.abs(s.y-player.y)<30&&actionCooldown<=0){player.health=Math.max(0,player.health-8);actionCooldown=.7;$('#health').textContent='♥ '.repeat(Math.ceil(player.health/20))}if(player.health<=0){player.health=100;player.x=12*TILE;player.y=(world.surface[12]-2)*TILE;notify('You caught your breath back at the start')}}}
function draw(){const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#1c3442');sky.addColorStop(.55,'#78917e');sky.addColorStop(1,'#c7ae78');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);let time=(world?.time||0);let sunX=w*.74+Math.sin(time*.015)*w*.16;ctx.fillStyle='#f8d987';ctx.beginPath();ctx.arc(sunX,h*.19,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f8dc9a44';ctx.beginPath();ctx.arc(sunX,h*.19,42,0,Math.PI*2);ctx.fill();drawHills(w,h);if(world){let start=Math.max(0,Math.floor(camera.x/TILE)-2),end=Math.min(W,Math.ceil((camera.x+w)/TILE)+2);for(let x=start;x<end;x++)for(let y=0;y<H;y++){let id=tile(x,y);if(!id)continue;let px=x*TILE-camera.x,py=y*TILE-camera.y;if(py>h+4||py<-TILE)continue;ctx.fillStyle=blockColor(id,x,y);ctx.fillRect(Math.floor(px),Math.floor(py),TILE+1,TILE+1);if(id===1){ctx.fillStyle='#9ac477';ctx.fillRect(px,py,TILE,4);ctx.fillStyle='#527b48';ctx.fillRect(px,py+4,TILE,2)}if(id===6){ctx.fillStyle='#72a65f';ctx.fillRect(px+4,py+5,4,4);ctx.fillRect(px+15,py+12,4,4)}if(id===3&&(x*7+y*13)%5===0){ctx.fillStyle='#88908a';ctx.fillRect(px+5,py+8,4,3)}if(id!==6&&id!==1){ctx.strokeStyle='#151f1d22';ctx.strokeRect(px+.5,py+.5,TILE-1,TILE-1)}}slimes.forEach(s=>{ctx.fillStyle='#84c875';ctx.beginPath();ctx.ellipse(s.x-camera.x+10,s.y-camera.y+12,13,10,0,Math.PI,0);ctx.fill();ctx.fillRect(s.x-camera.x-3,s.y-camera.y+11,26,8);ctx.fillStyle='#283c2d';ctx.fillRect(s.x-camera.x+5,s.y-camera.y+12,3,3);ctx.fillRect(s.x-camera.x+15,s.y-camera.y+12,3,3)});drawPlayer()}}
const originalDraw=draw;
function drawPlayer(){let x=Math.round(player.x-camera.x),y=Math.round(player.y-camera.y);ctx.save();if(player.face<0){ctx.translate(x+player.w,0);ctx.scale(-1,1);x=0}ctx.fillStyle='#372c29';ctx.fillRect(x+3,y+22,5,9);ctx.fillRect(x+9,y+22,5,9);ctx.fillStyle='#4e8290';ctx.fillRect(x+2,y+12,13,12);ctx.fillStyle='#d5a77d';ctx.fillRect(x+3,y+2,12,11);ctx.fillStyle='#5e4637';ctx.fillRect(x+2,y,13,5);ctx.fillStyle='#e7d59e';ctx.fillRect(x+12,y+6,2,2);if(player.attack>0){ctx.strokeStyle='#f6d990';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+14,y+16,20,-.8,.7);ctx.stroke()}ctx.restore()}
function hitAt(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(scene!=='game')return;const p=hitAt(e);mouse={...p,down:true,button:e.button};if(e.button===0)useTool(p.x,p.y);if(e.button===2)placeBlock(p.x,p.y)});window.addEventListener('pointerup',()=>mouse.down=false);canvas.addEventListener('pointermove',e=>{const p=hitAt(e);mouse.x=p.x;mouse.y=p.y});canvas.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(/^Digit[1-7]$/.test(e.code)){activeSlot=+e.code.slice(5)-1;drawHotbar()}if(e.code==='Escape'){if(scene==='game')togglePause();else if(scene==='paused')togglePause()}});window.addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-touch]').forEach(b=>{let key=b.dataset.touch;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;if(key==='action'){let held=mouse;mouse={x:innerWidth*.58,y:innerHeight*.53,down:true,button:0};useTool(mouse.x,mouse.y);setTimeout(()=>mouse=held,80)}});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))});
const baseStartWorld=startWorld;startWorld=function(data){baseStartWorld(data);slimes=[];$('#health').textContent='♥ '.repeat(Math.ceil(player.health/20));$('#hint').textContent='A / D or ← / → move   ·   Space jump   ·   Click to use tool   ·   Right-click place'};
</script>
</main></body></html>
